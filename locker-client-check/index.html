<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Locker Connection Check · FGS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a href="../">← App Hub</a>
      <h1>Locker Connection Check</h1>
      <p>Check which MCI 304 boards reply and save the results for support.</p>
    </div>
  </header>
  <main class="wrap">
    <section class="panel" aria-labelledby="step-title">
      <div class="panel-top">
        <h2 id="step-title" tabindex="-1">Connect to the lockers</h2>
        <output id="usb" class="badge" aria-live="polite">USB not selected</output>
      </div>
      <p id="instruction" role="status">Take the lockers out of service. Close the parkIT app. Keep the locker USB cable connected.</p>
      <div id="setup">
        <label for="capacity">Locker size</label>
        <select id="capacity">
          <option value="">Select a locker size</option>
          <option value="32">32 bays</option>
          <option value="64">64 bays</option>
          <option value="80">80 bays</option>
        </select>
        <p id="layout" class="muted"></p>
      </div>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <div class="actions">
        <button type="button" id="primary" class="primary" disabled>Choose locker USB and check</button>
        <button type="button" id="alternate" hidden></button>
      </div>
    </section>
    <section class="panel" id="results" aria-labelledby="results-title" hidden>
      <div class="panel-top">
        <h2 id="results-title">Board replies</h2>
        <p id="count" class="muted"></p>
      </div>
      <div id="passes"></div>
    </section>
    <section class="panel" aria-labelledby="report-title">
      <h2 id="report-title">Report</h2>
      <label for="notes">Notes <span class="muted">(optional)</span></label>
      <textarea id="notes" rows="3" maxlength="2000" placeholder="Site, locker reference or what you noticed"></textarea>
      <div class="actions">
        <button type="button" id="save" disabled>Download report</button>
        <button type="button" id="finish" disabled>Save and finish</button>
      </div>
      <p id="report-status" class="muted" role="status"></p>
      <details>
        <summary>Test activity</summary>
        <ol id="activity" class="activity"></ol>
      </details>
    </section>
  </main>
  <script type="module" src="app.js?v=usb-recovery-2"></script>
</body>
</html>
