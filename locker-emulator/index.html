<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCI 304 Locker Emulator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=board-toggles">
  <script type="module" src="app.js?v=headless-pico"></script>
</head>
<body>
  <header class="top">
    <div class="frame top-content">
      <div><a class="product" href="../">← App Hub</a><h1>MCI 304 Locker Emulator</h1></div>
      <div class="caption"><span class="dot"></span> <span id="connection">Pico disconnected</span> <span class="divider">/</span> CPU/IO v2.02 · FW 1.5.9fs</div>
    </div>
  </header>
  <main id="workspace" class="frame workspace">
    <section class="panel connection-panel" aria-labelledby="connection-title">
      <div class="panel-head">
        <div><h2 id="connection-title">Locker connection</h2><p id="cabinet-capacity"></p></div>
        <button id="connect" type="button">Connect Pico</button>
      </div>
      <p id="connection-help" class="connection-help" role="status">Connect the browser bridge COM port. Each cabinet uses a separate locker COM port in the desktop app.</p>
    </section>
    <div id="cabinet-grid" class="cabinet-grid"></div>
    <div class="legend" aria-label="Door indicators"><span class="legend-closed">Closed</span><span class="legend-open">Open</span><span class="legend-driven">Output active</span><span class="legend-release">Last release</span></div>
  </main>
  <template id="cabinet-template">
    <article class="cabinet-column">
      <section class="panel cabinet">
        <div class="panel-head">
          <div><h2 data-part="title">Locker cabinet</h2><p data-part="connection"></p></div>
          <details class="fault-controls">
            <summary data-part="fault-summary">Faults</summary>
            <div class="fault-fields">
              <div class="board-faults">
                <span data-part="board-status">All boards enabled</span>
                <button type="button" data-part="manage-boards">Manage boards</button>
              </div>
              <label>Reply delay
                <select data-part="reply-delay">
                  <option value="0">Off</option>
                  <option value="250">250 ms</option>
                  <option value="500">500 ms</option>
                  <option value="1000">1 second</option>
                  <option value="2000">2 seconds</option>
                </select>
              </label>
              <fieldset>
                <legend>Stuck-open door</legend>
                <div class="fault-door">
                  <label>Board <select data-part="stuck-board"></select></label>
                  <label>Door <select data-part="stuck-door"></select></label>
                </div>
                <button type="button" data-part="apply-stuck">Apply</button>
                <button type="button" data-part="clear-stuck" disabled>Clear</button>
              </fieldset>
            </div>
          </details>
        </div>
        <p data-part="last-release" class="release-status" role="status">No lock release recorded</p>
        <p data-part="door-status" class="door-status" role="status" hidden></p>
        <div class="cabinet-stage">
          <div data-part="cabinet" class="metal-cabinet" data-power="true">
            <div class="service-hatch">
              <div data-part="controller-deck" class="controller-deck" hidden></div>
              <button data-part="service-toggle" class="hatch-cover" type="button" aria-expanded="false">
                <span>Open service hatch</span>
              </button>
            </div>
            <div data-part="bays" class="bays"></div>
            <div class="base-hatch">
              <div data-part="power-panel" class="power-panel" data-on="true" role="status">
                <span class="power-lamp" aria-hidden="true"></span>
                <strong data-part="power-status">Power supplies on</strong>
                <span data-part="active-lock-count">0 locks energised</span>
              </div>
              <button data-part="restore-power" type="button" hidden>Restore power</button>
            </div>
          </div>
        </div>
      </section>
      <section class="panel monitor">
        <div class="panel-head"><h2 data-part="monitor-title">Live serial monitor</h2></div>
        <div data-part="trace" class="trace" role="region" aria-label="Serial commands, replies and door events" tabindex="0">
          <p class="trace-empty">Waiting for serial traffic</p>
        </div>
      </section>
    </article>
  </template>
</body>
</html>
